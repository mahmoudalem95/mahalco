<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>כניסה מוגנת</title>
<style>
:root{--bg:#f1f4f2;--surface:#fff;--ink:#14201b;--muted:#5b6a63;--line:#dbe2de;--accent:#0b6b57;--accent-ink:#fff;--accent-soft:#e2f0ea;--danger:#a3392f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1311;--surface:#161f1b;--ink:#e7eeea;--muted:#98a7a0;--line:#29352f;--accent:#5cc7ab;--accent-ink:#05251d;--accent-soft:#15382e;--danger:#ee8e84;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:24px 16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
svg{width:170px;height:auto;align-self:center}
h1{font-size:1.2rem;margin:0;text-align:center}
p{margin:0;color:var(--muted);font-size:.9rem;text-align:center}
input[type=password]{-webkit-appearance:none;appearance:none;width:100%;font-size:20px;letter-spacing:.12em;text-align:center;direction:ltr;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.rem{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);justify-content:center}
label.rem input{width:20px;height:20px;accent-color:var(--accent)}
button{min-height:50px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:1.05rem}
button[disabled]{opacity:.6}
.err{color:var(--danger);font-weight:600}
</style>
</head>

<form id="f" autocomplete="on">
<svg viewBox="0 0 320 112" role="img" aria-label="CPA Omar Alem &amp; Issa Tannous" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6e4f17"/><stop offset=".3" stop-color="#c89b3f"/><stop offset=".5" stop-color="#ecd48a"/><stop offset=".7" stop-color="#b8892f"/><stop offset="1" stop-color="#6e4f17"/></linearGradient></defs><g fill="url(#g)" font-family="Didot,'Bodoni 72','Times New Roman',Georgia,serif" text-anchor="middle" direction="ltr"><text x="192" y="42" font-size="44" font-weight="700" letter-spacing="5">CPA</text><text x="46" y="104" font-size="86">&amp;</text><text x="196" y="74" font-size="23" letter-spacing="1.5">OMAR ALEM</text><text x="196" y="102" font-size="23" letter-spacing="1.5">ISSA TANNOUS</text></g></svg>
<h1>מחשבון מס — כניסה מוגנת</h1>
<p>הזינו את הסיסמה כדי לפתוח את הכלי.</p>
<input type="text" name="username" value="cpa" autocomplete="username" hidden>
<input id="pw" type="password" inputmode="numeric" autocomplete="current-password" aria-label="סיסמה" required>
<label class="rem"><input id="rem" type="checkbox" checked> לזכור במכשיר הזה</label>
<button id="go" type="submit">פתיחה</button>
<p class="err" id="err" role="alert" hidden>הסיסמה שגויה. נסו שוב.</p>
<p id="nosupport" hidden>הדפדפן לא תומך בפתיחה מוצפנת. פתחו את הקישור ב־Safari או Chrome.</p>
</form>

derive(pw).then(function(key){return C.decrypt({name:'AES-GCM',iv:u8(IV)},key,u8(CT)).then(function(){return key;});})
.then(function(key){if(document.getElementById('rem').checked){return C.exportKey('raw',key).then(function(raw){try{localStorage.setItem(KEY,b64(raw));}catch(x){}return key;});}return key;})
.then(open)
.catch(function(){err.hidden=false;btn.disabled=false;btn.textContent='פתיחה';var i=document.getElementById('pw');i.select();});});
})();
