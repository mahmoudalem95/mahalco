        }
        @media (prefers-color-scheme: dark) {
            :root { --ink: #E6E8E3; --paper: #161A1E; --card: #1C2126; --rule: #323940; --muted: #9BA4AE; }

        * { box-sizing: border-box }
        html, body { height: 100% }
        body {
            margin: 0; background: var(--paper); color: var(--ink);

        main { flex: 1; display: grid; place-items: center; padding: 32px 16px; }
        .card {
            width: 100%; max-width: 34rem; background: var(--card); border: 1px solid var(--rule);
            border-radius: 14px; padding: 34px 28px; text-align: center;
        }
        /* barrier: alternating red/white stripes, as on a work-zone board */
        .barrier {
            height: 14px; border-radius: 3px; margin: 0 auto 26px; max-width: 13rem;
            background: repeating-linear-gradient(135deg, #C8372B 0 14px, #F4F5F1 14px 28px);
            box-shadow: inset 0 0 0 1px rgba(0,0,0,.12);
        }
        h1 { margin: 0 0 12px; font-size: clamp(1.6rem, 5vw, 2.1rem); line-height: 1.15; letter-spacing: -.02em; font-weight: 800 }
        p { margin: 0 0 14px; color: var(--muted) }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px }
        .btn {
            display: inline-flex; align-items: center; min-height: 44px; padding: 8px 18px; border-radius: 10px;
            font-weight: 600; font-size: 15px; text-decoration: none; border: 1px solid var(--rule); color: var(--ink);
        }
        .btn.solid { background: var(--marking); border-color: var(--marking); color: #141A1F }
        footer { text-align: center; padding: 18px 16px 24px; font-size: 13.5px; color: var(--muted) }
