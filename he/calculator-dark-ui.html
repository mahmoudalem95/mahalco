<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mahalco-calc-api" content="https://mahalco-calc.onrender.com">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://mahalco-calc.onrender.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark">
<title>מחשבון ערכי תכן וחיפוש בהנחיות – תנועה וכבישים</title>
<style>
  :root{
    --bg:#121624;
    --bg-deep:#0b1020;
    --surface:#171e31;
    --surface-2:#1d263c;
    --surface-3:#222d46;
    --border:#30415f;
    --border-bright:#3e557b;
    --primary:#f5b82e;
    --primary-bright:#ffd45a;
    --primary-dark:#b97c08;
    --primary-light:#2a2b29;
    --accent:#ffcf4a;
    --accent-light:#3a3020;
    --green:#2dd4a0;
    --green-light:#12352f;
    --text:#f4f7fb;
    --text-secondary:#d8e1ef;
    --muted:#8ea0ba;
    --shadow:0 12px 32px rgba(0,0,0,.28);
    --glow:0 0 22px rgba(245,184,46,.14);
  }

  *{box-sizing:border-box;}

  html{background:var(--bg-deep);}

  body{
    margin:0;
    font-family:"Segoe UI","Arial",sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(31,62,108,.28), transparent 34%),
      radial-gradient(circle at 85% 10%, rgba(245,184,46,.06), transparent 28%),
      linear-gradient(180deg,#101728 0%,#121624 45%,#0e1423 100%);
    color:var(--text);
    line-height:1.5;
    min-height:100vh;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.16;
    background-image:
      linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:32px 32px;
    mask-image:linear-gradient(to bottom,black,transparent 85%);
  }

  header{
    position:relative;
    background:
      linear-gradient(135deg,#0b1222 0%,#16233a 58%,#10192b 100%);
    color:#fff;
    padding:26px 28px;
    border-bottom:1px solid rgba(245,184,46,.55);
    box-shadow:0 3px 22px rgba(0,0,0,.38);
    overflow:hidden;
  }

  header::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--primary),transparent);
    opacity:.9;
  }

  header h1{
    margin:0 0 4px 0;
    font-size:23px;
    font-weight:700;
    letter-spacing:.2px;
  }

  header p{
    margin:0;
    font-size:13px;
    color:#b8c8df;
    opacity:1;
  }

  .container{
    max-width:1180px;
    margin:24px auto;
    padding:0 16px;
    position:relative;
  }

  .toolbar{
    position:relative;
    background:linear-gradient(145deg,var(--surface),#131b2d);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    margin-bottom:18px;
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
    box-shadow:var(--shadow),var(--glow);
  }

  .toolbar::before{
    content:"";
    position:absolute;
    top:-1px;
    left:14px;
    right:14px;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--primary),transparent);
    opacity:.75;
  }

  .toolbar .field{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:170px;
    flex:1 1 170px;
  }

  .toolbar label{
    font-size:12px;
    font-weight:700;
    color:var(--text-secondary);
  }

  .toolbar select,
  .toolbar input[type=number]{
    padding:9px 11px;
    border:1px solid var(--border-bright);
    border-radius:8px;
    font-size:14px;
    background:#0f1729;
    color:var(--text);
    direction:rtl;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  }

  .toolbar select:hover,
  .toolbar input[type=number]:hover{
    border-color:#536b96;
  }

  .toolbar select:focus,
  .toolbar input:focus{
    outline:2px solid rgba(245,184,46,.45);
    outline-offset:1px;
    border-color:var(--primary);
    box-shadow:0 0 0 3px rgba(245,184,46,.09);
  }

  .btn{
    padding:10px 19px;
    border:1px solid transparent;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    transition:.18s ease;
  }

  .btn-primary{
    background:linear-gradient(180deg,#ffd45a,#e8a916);
    color:#17130a;
    border-color:#ffe18a;
    box-shadow:0 5px 18px rgba(245,184,46,.22);
  }

  .btn-primary:hover{
    background:linear-gradient(180deg,#ffdc72,#f0b52c);
    transform:translateY(-1px);
    box-shadow:0 7px 22px rgba(245,184,46,.3);
  }

  .btn-ghost{
    background:#182238;
    color:var(--text-secondary);
    border-color:var(--border-bright);
  }

  .btn-ghost:hover{
    background:#202c45;
    border-color:#536b96;
    color:#fff;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(340px,1fr));
    gap:18px;
  }

  .card{
    background:
      linear-gradient(145deg,rgba(29,38,60,.98),rgba(20,28,45,.98));
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:var(--shadow);
    position:relative;
  }

  .card::before{
    content:"";
    position:absolute;
    top:0;
    left:14px;
    right:14px;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(245,184,46,.35),transparent);
  }

  .card:hover{
    border-color:#415778;
    box-shadow:0 15px 34px rgba(0,0,0,.35),0 0 18px rgba(41,77,127,.12);
  }

  .card-header{
    background:linear-gradient(90deg,#1d2942,#172238);
    padding:11px 16px;
    font-size:15px;
    font-weight:700;
    color:var(--text);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:9px;
  }

  .card-header .icon{
    width:28px;
    height:28px;
    background:linear-gradient(145deg,#f7c23c,#b97c08);
    color:#15120a;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    flex-shrink:0;
    box-shadow:0 0 14px rgba(245,184,46,.16);
  }

  .card-body{
    padding:14px 16px;
    background:linear-gradient(180deg,rgba(18,26,43,.35),rgba(9,15,27,.12));
  }

  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:8px 0;
    border-bottom:1px dashed #2a3852;
    gap:10px;
  }

  .row:last-child{border-bottom:none;}

  .row .k{
    font-size:13.5px;
    color:var(--text-secondary);
  }

  .row .v{
    font-size:15px;
    font-weight:800;
    color:var(--primary-bright);
    white-space:nowrap;
    text-shadow:0 0 12px rgba(245,184,46,.12);
  }

  .note{
    font-size:12px;
    color:#aebdd1;
    margin-top:8px;
    padding:8px 11px;
    background:#111b2e;
    border-right:3px solid var(--primary);
    border-radius:5px;
  }

  .warn{
    background:#30201f;
    border-right-color:#ff6b5c;
    color:#ffb3aa;
  }

  .ok{
    background:var(--green-light);
    border-right-color:var(--green);
    color:#8cf0cf;
  }

  .hidden{display:none;}

  footer{
    text-align:center;
    padding:22px;
    font-size:12px;
    color:#71839e;
  }

  .badge{
    display:inline-block;
    font-size:11px;
    padding:3px 8px;
    border-radius:10px;
    font-weight:700;
    margin-right:6px;
    border:1px solid transparent;
  }

  .badge-urban{
    background:#242b38;
    color:#ffd45a;
    border-color:#695629;
  }

  .badge-inter{
    background:#302b20;
    color:#f6ca65;
    border-color:#66552b;
  }

  .badge-intersection{
    background:#16342e;
    color:#63e2bd;
    border-color:#216050;
  }

  .badge-parking{
    background:#28213a;
    color:#c4a2ff;
    border-color:#584080;
  }

  #emptyState{
    background:linear-gradient(145deg,#171f32,#121a2b);
    border-color:#344563;
    color:var(--muted) !important;
  }

  #emptyState strong{
    color:var(--primary-bright);
  }

  /* Dynamic selector cards */
  #results > .card[style*="grid-column"]{
    background:linear-gradient(145deg,#18233a,#121a2b);
    border-color:#3a4d70;
  }

  #results > .card[style*="grid-column"] select{
    background:#0e1729 !important;
    color:#f4f7fb !important;
    border-color:#405779 !important;
  }

  @media(max-width:600px){
    .toolbar{
      flex-direction:column;
      align-items:stretch;
    }

    .toolbar .field{min-width:0;}

    .grid{
      grid-template-columns:1fr;
    }

    header{
      padding:22px 18px;
    }

    header h1{
      font-size:20px;
    }
  }
  #params{display:contents;}
  .toolbar input[type=number]{width:170px;}
  .tabs{display:flex;gap:6px;margin:0 0 14px 0;border-bottom:1px solid var(--border);}
  .tab{background:none;border:none;color:var(--muted);font:inherit;font-size:15px;font-weight:600;padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;}
  .tab[aria-selected=true]{color:var(--primary-bright);border-bottom-color:var(--primary);}
  .tab:focus-visible,.src:focus-visible,.hit:focus-visible,.chip:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(420px,1fr));}
  .card.wide{grid-column:1/-1;}
  .tbl-wrap{overflow-x:auto;margin:10px 0 4px;}
  .tbl{border-collapse:collapse;width:100%;font-size:12.5px;}
  .tbl th{background:#141d31;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;}
  .tbl td{padding:6px 8px;border-bottom:1px solid #243149;color:var(--text-secondary);}
  .tbl tr.hl td{background:rgba(245,184,46,.13);color:var(--primary-bright);font-weight:700;}
  .srcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .src{background:#0f1729;border:1px solid var(--border);color:#b8c8df;border-radius:6px;padding:5px 9px;font:inherit;font-size:11.5px;cursor:pointer;text-align:right;}
  .src:hover{border-color:var(--primary);color:var(--primary-bright);}
  .bad{color:#ff8a7a;}
  .sbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .sbox input{flex:1;min-width:240px;font:inherit;font-size:16px;padding:11px 14px;border-radius:9px;border:1px solid var(--border-bright);background:#0e1526;color:var(--text);}
  .sbox input:focus{outline:none;border-color:var(--primary);box-shadow:var(--glow);}
  #docFilters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;}
  .docf{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;}
  .docf input{accent-color:var(--primary);}
  .doc-tag{display:inline-block;border-radius:5px;padding:2px 7px;font-size:11.5px;background:#1b2740;color:#cfe0f5;border-inline-start:3px solid #6aa7ff;}
  .t-RM{border-color:#6aa7ff}.t-TZ{border-color:#ff7d6a}.t-MR{border-color:#f5b82e}.t-IU{border-color:#2dd4a0}
  .t-RP{border-color:#b98cff}.t-PK{border-color:#ffd45a}.t-TC{border-color:#4fd1e8}.t-SG{border-color:#ff9dd0}.t-TA{border-color:#ff9f43}.t-TW{border-color:#a3e635}.t-V2{border-color:#7dd3fc}.t-V3{border-color:#7dd3fc}.t-V4{border-color:#7dd3fc}.t-V5{border-color:#7dd3fc}.t-V6{border-color:#7dd3fc}.t-V7{border-color:#7dd3fc}.t-V8{border-color:#7dd3fc}.t-V9{border-color:#7dd3fc}.t-V10{border-color:#7dd3fc}.t-V11{border-color:#7dd3fc}.t-V13{border-color:#7dd3fc}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .chip{background:#172238;border:1px solid var(--border);color:var(--text-secondary);border-radius:20px;padding:4px 11px;font:inherit;font-size:12.5px;cursor:pointer;}
  .chip:hover{border-color:var(--primary);}
  #searchStatus,#sCount{font-size:12.5px;color:var(--muted);margin:6px 0;}
  .hit{background:linear-gradient(145deg,rgba(29,38,60,.98),rgba(20,28,45,.98));border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;}
  .hit:hover{border-color:var(--border-bright);}
  .hit-h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px;}
  .pg{font-size:12px;color:var(--primary);white-space:nowrap;}
  .snip{font-size:13.5px;color:var(--text-secondary);line-height:1.7;}
  mark{background:rgba(245,184,46,.3);color:#fff;border-radius:3px;padding:0 2px;}
  #pv.hidden{display:none;}
  #pv{position:fixed;inset:0;background:rgba(5,9,18,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .pv-box{background:#131b2e;border:1px solid var(--border-bright);border-radius:12px;width:min(860px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .pv-h{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .pv-h h2{font-size:14px;margin:0;flex:1;color:var(--primary-bright);}
  #pvBody{white-space:pre-wrap;overflow:auto;padding:16px 18px;font-size:13.5px;line-height:1.75;color:var(--text-secondary);}
  .pv-h a,.pv-h button{font-size:12.5px;}
  @media(max-width:600px){.grid{grid-template-columns:1fr;} .toolbar input[type=number]{width:100%;}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}

  /* ==================== MOBILE LAYER — מהאלco (phone / tablet) ==================== */
  .pv-mnav{display:none}
  #mUp{display:none}
  #mClear{display:none}
  .sbox .sinput{flex:1;min-width:240px;display:flex;position:relative}
  .m-lbl{font-size:12px;color:var(--muted);margin:10px 0 0;font-weight:700}
  .chip.recent{background:rgba(245,184,46,.13);border-color:rgba(245,184,46,.45);color:var(--primary-bright)}
  @media (max-width:820px){
    header{padding:14px 16px;position:sticky;top:0;z-index:40}
    header h1{font-size:17px;line-height:1.3}
    header p{font-size:11.5px;margin-top:3px}
    body.m-scrolled header{padding:9px 16px}
    body.m-scrolled header p{display:none}
    body.m-scrolled header h1{font-size:15px}

    .container{margin:12px auto;padding:0 12px calc(30px + env(safe-area-inset-bottom))}

    /* --- טאבים דביקים --- */
    .tabs{position:sticky;top:0;z-index:35;margin:0 -12px 12px;padding:8px 12px 0;
      background:rgba(11,16,32,.96);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
    .tab{flex:1;min-height:48px;font-size:14px;text-align:center;justify-content:center}

    /* --- מחשבון: הפקדים נשארים על המסך מעל התוצאה --- */
    #calcView .toolbar{position:sticky;top:60px;z-index:30;padding:12px;margin-bottom:14px;
      max-height:56vh;overflow:auto;gap:10px;border-radius:12px}
    #calcView .toolbar .field{min-width:0;flex:1 1 calc(50% - 10px)}
    #calcView .toolbar > .field:nth-child(1),#calcView .toolbar > .field:nth-child(2){flex:1 1 100%}
    .toolbar select,.toolbar input[type=number]{font-size:16px;min-height:46px;width:100%}
    .toolbar .btn{width:100%;min-height:46px}
    #params{display:flex;flex-wrap:wrap;gap:10px;width:100%}
    #params .field{flex:1 1 calc(50% - 10px)}
    .grid{grid-template-columns:1fr!important;gap:12px}
    .card{border-radius:12px}

    /* --- חיפוש: תיבה דביקה, ניקוי מהיר, סינון מתקפל --- */
    #searchView .toolbar{position:sticky;top:60px;z-index:30;padding:10px 12px 8px;
      margin-bottom:10px;border-radius:12px}
    .sbox{gap:8px;flex-wrap:nowrap}
    .sbox .sinput{position:relative;flex:1;min-width:0;display:flex}
    .sbox input{width:100%;min-width:0;font-size:16px;min-height:50px;
      padding:12px 14px;padding-inline-end:44px;border-radius:12px}
    .sbox .btn{min-height:50px;padding:0 16px;white-space:nowrap}
    #mClear{position:absolute;inset-inline-end:7px;top:50%;transform:translateY(-50%);
      width:34px;height:34px;border-radius:50%;border:0;display:none;align-items:center;
      justify-content:center;background:#2a3450;color:#cfd8e9;font-size:15px;cursor:pointer;z-index:3}
    #mClear.on{display:flex}
    .chips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:7px;margin:9px -12px 4px;
      padding:2px 12px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;
      scroll-snap-type:x proximity}
    .chips::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;min-height:40px;font-size:13px;padding:6px 14px;scroll-snap-align:start}
    .chip.recent{background:rgba(245,184,46,.13);border-color:rgba(245,184,46,.45);color:var(--primary-bright)}
    .m-lbl{font-size:11.5px;color:var(--muted);margin:8px 0 0;font-weight:700}
    #mFilt{margin-top:8px}
    #mFilt summary{list-style:none;cursor:pointer;font-size:13px;color:var(--text-secondary);
      display:flex;align-items:center;gap:6px;min-height:40px;font-weight:700}
    #mFilt summary::-webkit-details-marker{display:none}
    #mFilt summary::after{content:'▾';color:var(--primary);transition:transform .2s;margin-inline-start:auto}
    #mFilt[open] summary::after{transform:rotate(180deg)}
    #docFilters{margin:6px 0 2px;gap:9px}
    .docf{font-size:13px;min-height:40px;background:#172238;border:1px solid var(--border);
      border-radius:8px;padding:5px 10px}
    .docf input{width:18px;height:18px}
    #searchStatus{font-size:12.5px}
    #sCount{font-size:13px;color:var(--muted);margin:2px 0 8px}
    .hit{padding:14px;border-radius:12px;margin-bottom:10px}
    .hit-h{flex-wrap:wrap;gap:6px}
    #moreBtn{width:100%;min-height:50px;font-size:15px}

    /* --- מציג העמוד: מסך מלא + ניווט לאגודל --- */
    #pv{padding:0;align-items:stretch}
    .pv-box{width:100%;max-width:none;height:100dvh;max-height:100dvh;border-radius:0;border:0}
    .pv-h{position:sticky;top:0;background:#131b2e;z-index:2;padding:10px 12px;gap:6px}
    .pv-h h2{font-size:13px;flex:1 1 100%;order:-1}
    .pv-h button:not(#pvClose){display:none}
    .pv-h #pvClose{min-height:42px}
    #pvBody{font-size:15px;line-height:1.85;padding:14px 16px calc(80px + env(safe-area-inset-bottom))}
    .pv-mnav{display:flex;gap:8px;position:fixed;left:0;right:0;bottom:0;z-index:5;
      padding:9px 12px calc(9px + env(safe-area-inset-bottom));
      background:rgba(19,27,46,.98);border-top:1px solid var(--border)}
    .pv-mnav button{flex:1;min-height:48px;font-size:14px}

    /* --- חזרה למעלה --- */
    #mUp{display:flex;position:fixed;inset-inline-start:14px;
      bottom:calc(16px + env(safe-area-inset-bottom));z-index:45;width:48px;height:48px;
      border-radius:50%;align-items:center;justify-content:center;background:var(--primary);
      color:#1a1a2e;border:0;font-size:20px;box-shadow:0 6px 18px rgba(0,0,0,.4);
      opacity:0;pointer-events:none;transition:opacity .2s}
    body.m-scrolled #mUp{opacity:1;pointer-events:auto}
  }
</style>
</head>
<body>
<header>
  <h1>מחשבון ערכי תכן – תנועה וכבישים</h1>
  <p>ערכים מאומתים מתוך ספרי ההנחיות, עם הפניה לטבלה ולעמוד, וחיפוש חופשי בכל טקסט הספרים</p>
</header>

<div class="container">
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="calc" aria-selected="true" data-on-click="0">מחשבון ערכי תכן</button>
    <button class="tab" role="tab" data-tab="search" aria-selected="false" data-on-click="1">חיפוש בספרים</button>
  </div>

  <section id="calcView">
    <div class="toolbar" aria-label="לוח בקרת חישוב">
      <div class="field"><label for="env">תחום</label><select id="env"></select></div>
      <div class="field"><label for="seg">נושא</label><select id="seg"></select></div>
      <div id="params"></div>
      <button class="btn btn-ghost" data-on-click="2">איפוס</button>
    </div>
    <div id="results" class="grid"></div>
    <div id="emptyState" class="card" style="padding:24px;text-align:center;color:var(--muted);">
      <p style="margin:0;">בחרו תחום ונושא – התוצאה מתעדכנת מיד.</p>
    </div>
  </section>

  <section id="searchView" class="hidden">
    <div class="toolbar" style="display:block">
      <div class="sbox">
        <input id="q" type="search" placeholder='לדוגמה: רוחב נתיב שמאלה, "משולש ראות", תמרור 214, נתיב האטה' aria-label="חיפוש בספרים">
        <button class="btn btn-primary" data-on-click="3">חפש</button>
      </div>
      <div id="docFilters" aria-label="סינון לפי ספר"></div>
      <div class="chips">
        <button class="chip" data-on-click="4">רוחב נתיב</button>
        <button class="chip" data-on-click="5">משולש ראות</button>
        <button class="chip" data-on-click="6">נתיב האטה</button>
        <button class="chip" data-on-click="7">אורך אחסון</button>
        <button class="chip" data-on-click="8">מעגל תנועה</button>
        <button class="chip" data-on-click="9">מעבר חצייה</button>
        <button class="chip" data-on-click="10">תחנת אוטובוס</button>
        <button class="chip" data-on-click="11">הצדקים להצבת תמרור</button>
      </div>
      <div id="searchStatus"></div>
    </div>
    <div id="sCount"></div>
    <div id="sResults"></div>
    <button id="moreBtn" class="btn btn-ghost hidden" data-on-click="12">הצג עוד תוצאות</button>
  </section>
</div>

<div id="pv" class="hidden" role="dialog" aria-modal="true" aria-labelledby="pvTitle" data-on-click="13">
  <div class="pv-box">
    <div class="pv-h">
      <h2 id="pvTitle"></h2>
      <button class="btn btn-ghost" data-on-click="14">עמוד קודם</button>
      <button class="btn btn-ghost" data-on-click="15">עמוד הבא</button>
      <a id="pvPdf" class="btn btn-ghost hidden" target="_blank" rel="noopener">פתח PDF</a>
      <button id="pvClose" class="btn btn-primary" data-on-click="16">סגור</button>
    </div>
    <div id="pvBody"></div>
  </div>
</div>
