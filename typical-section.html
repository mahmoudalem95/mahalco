<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="חתך טיפוסי עירוני ובין-עירוני – בניית חתך רוחב לפי הנחיות נתיבי ישראל (כרך 1, פרק 3), בדיקות חיות מול ההנחיות, מדריך ההנחיות המלא וגיליון A0 בקנה מידה אמיתי.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>MAHALCO — חתך טיפוסי + מדריך ההנחיות</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#EFEFF4; --fill-2:#E4E4EA; --label:#1C1C1E; --label-2:#6C6C70; --label-3:#9A9AA0;
  --sep:rgba(60,60,67,.16); --tint:#1F5FA8; --tint-soft:rgba(31,95,168,.12); --hi:#E9A21F; --hi-soft:rgba(233,162,31,.18);
  --red:#D93A2B; --red-soft:rgba(217,58,43,.10); --amber:#B97A08; --amber-soft:rgba(233,162,31,.14); --green:#2E9D55; --green-soft:rgba(46,157,85,.12);
  --paper:#fbfaf6; --bar:rgba(242,242,247,.82); --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
  --r-l:14px; --r-m:10px; --r-s:8px; --insp:420px; --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="dark"]{ --bg:#000; --card:#1C1C1E; --fill:#2C2C2E; --fill-2:#3A3A3C; --label:#F2F2F7; --label-2:#AEAEB2; --label-3:#7C7C80;
    --sep:rgba(84,84,88,.55); --tint:#5AA0F2; --tint-soft:rgba(90,160,242,.16); --bar:rgba(18,18,20,.8);
    --red:#FF6B5E; --red-soft:rgba(255,107,94,.14); --amber:#F2B53A; --green:#4CD27B; --shadow:none }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Heebo",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px;border-radius:6px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.nav{position:sticky;top:0;z-index:40;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--sep);padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.nav-in{display:flex;align-items:center;gap:10px;min-height:56px}
.nav h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.nav h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--label-2);letter-spacing:0}
.nav .sp{flex:1}
.nbtn{min-width:44px;height:40px;padding:0 12px;border:0;border-radius:20px;background:var(--fill);color:var(--tint);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.nbtn:disabled{color:var(--label-3);cursor:default}
.nbtn.primary{background:var(--tint);color:#fff}
.nbtn svg{width:19px;height:19px}
.pill{white-space:nowrap;flex:none;height:32px;padding:0 12px;border:0;border-radius:16px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:background .3s,color .3s}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}

.shell{display:grid;grid-template-columns:minmax(0,1fr) var(--insp);gap:18px;padding:16px max(16px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  max-width:1500px;margin:0 auto;align-items:start}
.stage{grid-column:1;grid-row:1;position:sticky;top:74px;display:flex;flex-direction:column;gap:14px;min-width:0}
.insp{grid-column:2;grid-row:1;min-width:0}
@media (max-width:1023px){
  .shell{grid-template-columns:1fr;gap:12px}
  .stage{grid-column:1;grid-row:1;top:62px;z-index:20}
  .insp{grid-column:1;grid-row:2}
}

.canvas{background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden}
.canvas-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:.5px solid var(--sep)}
.seg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;position:relative;isolation:isolate}
.seg button{position:relative;z-index:1;border:0;background:none;min-height:32px;padding:0 13px;border-radius:7px;font-size:14px;font-weight:500;color:var(--label);white-space:nowrap}
.seg .knob{position:absolute;z-index:0;top:2px;bottom:2px;border-radius:7px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transition:left .32s var(--ease),width .32s var(--ease)}
:root[data-theme="dark"] .seg .knob{background:#636366}
.seg button[aria-pressed="true"]{font-weight:600}
.seg.full{display:flex}
.seg.full button{flex:1;padding:0 6px}
.zoom{margin-inline-start:auto;display:flex;gap:4px}
.zoom button{width:36px;height:32px;border:0;border-radius:8px;background:var(--fill);color:var(--tint);font-size:17px;font-weight:600}
.zoom output{min-width:48px;text-align:center;font-size:13px;color:var(--label-2);align-self:center;font-variant-numeric:tabular-nums}
.sheetwrap{background:var(--paper);overflow:auto;touch-action:pan-x pan-y;max-height:58vh;-webkit-overflow-scrolling:touch}
@media (max-width:1023px){ .sheetwrap{max-height:34vh} }
#drawing{padding:8px;min-width:100%;transition:width .25s var(--ease)}
#drawing svg{direction:ltr;display:block;width:100%;height:auto;background:var(--paper)}
#drawing .selrect{fill:var(--hi-soft);stroke:var(--hi);stroke-width:.6;transition:x .25s var(--ease),width .25s var(--ease)}

.ribbon-wrap{padding:10px 12px 12px;border-top:.5px solid var(--sep)}
.ribbon-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;font-size:13px;color:var(--label-2)}
.ribbon-head b{color:var(--label);font-size:15px;font-variant-numeric:tabular-nums}
.ribbon-head .gap{margin-inline-start:auto;font-weight:600}
.ribbon-head .gap.bad{color:var(--red)} .ribbon-head .gap.ok{color:var(--green)}
.ribbon{direction:ltr;display:flex;height:46px;border-radius:9px;overflow:hidden;background:var(--fill);position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.rb{position:relative;min-width:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:rgba(0,0,0,.72);
  transition:flex-grow .28s var(--ease),box-shadow .2s;overflow:hidden;white-space:nowrap;cursor:pointer;border-right:1px solid rgba(255,255,255,.7)}
.rb:last-child{border-right:0}
.rb span{pointer-events:none;padding:0 2px;text-overflow:clip;overflow:hidden}
.rb.sel{box-shadow:inset 0 0 0 3px var(--hi)}
.rb.bad::after,.rb.warn::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.rb.warn::after{background:var(--hi)}
.ribbon.dragging .rb{transition:none}
.grip{position:absolute;top:0;bottom:0;width:26px;margin-left:-13px;z-index:2;cursor:ew-resize;display:flex;align-items:center;justify-content:center}
.grip::before{content:"";width:4px;height:22px;border-radius:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.22),0 1px 4px rgba(0,0,0,.25);transition:transform .15s,height .15s}
.grip.on::before{height:34px;transform:scaleX(1.4);background:var(--hi)}
.ribbon-hint{font-size:12px;color:var(--label-3);margin-top:6px}
.tip{position:fixed;z-index:80;pointer-events:none;background:rgba(28,28,30,.92);color:#fff;font-size:13px;font-weight:600;padding:6px 10px;border-radius:9px;transform:translate(-50%,-120%);direction:ltr;white-space:nowrap;font-variant-numeric:tabular-nums}

.readouts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:1023px){ .readouts{grid-template-columns:1fr} }
.box{background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow);padding:14px 16px}
.box h3{margin:0 0 10px;font-size:15px;font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--fill);border-radius:var(--r-m);padding:9px 11px}
.stat span{display:block;font-size:12px;color:var(--label-2);line-height:1.25}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap}
.stat b small{font-size:12px;font-weight:500;color:var(--label-2)}
.stat.pulse{animation:pulse .5s var(--ease)}
@keyframes pulse{40%{background:var(--tint-soft)}}
.chk{position:relative;padding:9px 12px 9px 12px;padding-inline-start:34px;border-radius:var(--r-m);background:var(--green-soft);margin-bottom:6px;font-size:14px;line-height:1.4}
.chk::before{content:"✓";position:absolute;inset-inline-start:10px;top:9px;width:17px;height:17px;border-radius:50%;background:var(--green);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.chk.warn{background:var(--amber-soft)} .chk.warn::before{content:"!";background:var(--hi)}
.chk.bad{background:var(--red-soft)} .chk.bad::before{content:"!";background:var(--red)}
.chk b{display:block;font-size:12.5px;color:var(--label-2)}
.chk.new{animation:chkin .4s var(--ease)}
@keyframes chkin{from{opacity:0;transform:translateY(-4px)}}
.sheetlist{display:flex;flex-direction:column;gap:6px}
.sheetlist div{display:flex;gap:8px;align-items:center;background:var(--fill);border-radius:var(--r-m);padding:6px 6px 6px 12px;padding-inline-start:12px;font-size:14px}
.sheetlist div span{flex:1}
.sheetlist button{border:0;min-height:36px;padding:0 12px;border-radius:9px;background:var(--card);color:var(--tint);font-weight:600;font-size:14px}
.sheetlist button[data-a="rm"]{color:var(--red)}
.hint{font-size:13px;color:var(--label-2);margin:6px 0 0;line-height:1.45}

.tabs{position:sticky;top:74px;z-index:15;background:var(--bg);padding:0 0 10px}
@media (max-width:1023px){ .tabs{position:static} }
.pane{display:none}
.pane.on{display:block;animation:panein .28s var(--ease)}
@keyframes panein{from{opacity:0;transform:translateY(6px)}}
.gh{margin:18px 16px 6px;font-size:13px;color:var(--label-2)}
.gh:first-child{margin-top:4px}
.gf{margin:6px 16px 0;font-size:12.5px;color:var(--label-2);line-height:1.45}
.group{background:var(--card);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 16px;position:relative}
.li+.li::before{content:"";position:absolute;top:0;inset-inline-start:16px;inset-inline-end:0;border-top:.5px solid var(--sep)}
.li>label,.li>.lb{flex:1;min-width:0;font-size:16px}
.li input[type=text],.li input:not([type]){flex:1.2;min-width:0;border:0;background:none;text-align:left;direction:rtl;text-align:end;color:var(--label-2);font-size:16px;padding:8px 0}
.li input:not([type]):focus{color:var(--label);outline:none}
.li .sel-wrap{position:relative}
select.plain{appearance:none;-webkit-appearance:none;border:0;background:none;color:var(--label-2);font-size:16px;padding:8px 18px 8px 0;text-align:end;max-width:100%}
.chev{pointer-events:none;position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--label-3);font-size:13px}

.stp{display:inline-flex;align-items:center;background:var(--fill);border-radius:9px;height:34px;direction:ltr;flex:none}
.stp button{width:38px;height:34px;border:0;background:none;color:var(--label);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:9px}
.stp button:active{background:var(--fill-2)}
.stp input{width:62px;height:34px;border:0;border-left:.5px solid var(--sep);border-right:.5px solid var(--sep);background:none;text-align:center;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp input:disabled{color:var(--label-3)}
.stp.off{opacity:.45;pointer-events:none}
.unit{font-size:13px;color:var(--label-2);margin-inline-start:-6px}

.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill-2);position:relative;flex:none;cursor:pointer;transition:background .25s;margin:0}
.sw::after{content:"";position:absolute;top:2px;right:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .25s var(--ease)}
.sw:checked{background:var(--green)}
.sw:checked::after{transform:translateX(-20px)}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.pcard{border:0;text-align:start;background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px;position:relative;transition:transform .15s,box-shadow .2s}
.pcard:active{transform:scale(.97)}
.pcard[aria-pressed="true"]{box-shadow:0 0 0 2.5px var(--tint),var(--shadow)}
.pcard .thumb{direction:ltr;display:flex;height:30px;border-radius:6px;overflow:hidden;background:var(--fill)}
.pcard .thumb i{display:block;height:100%}
.pcard b{font-size:14px;font-weight:600;line-height:1.3}
.pcard small{font-size:12px;color:var(--label-2)}
.pcard .ck{position:absolute;top:8px;inset-inline-start:8px;width:20px;height:20px;border-radius:50%;background:var(--tint);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center}
.pcard[aria-pressed="true"] .ck{display:flex}
#presetSrc{margin:10px 4px 0}
#presetFilter{overflow-x:auto;scrollbar-width:none;justify-content:flex-start}
#presetFilter::-webkit-scrollbar{display:none}
#presetFilter button{flex:0 0 auto;padding:0 12px}

.cells{display:flex;flex-direction:column}
.cell{position:relative;padding:10px 12px 10px 12px;padding-inline-start:16px;background:var(--card);transition:background .25s}
.cell+.cell{border-top:.5px solid var(--sep)}
.cell::after{content:"";position:absolute;top:8px;bottom:8px;inset-inline-start:0;width:4px;border-radius:0 3px 3px 0;background:transparent;transition:background .25s}
[dir=rtl] .cell::after{border-radius:3px 0 0 3px}
.cell.bad::after{background:var(--red)} .cell.warn::after{background:var(--hi)}
.cell.sel{background:var(--hi-soft)}
.cell.flash{animation:flash .9s var(--ease)}
@keyframes flash{0%{background:var(--tint-soft)}100%{background:var(--card)}}
.cell.drag{z-index:5;box-shadow:0 12px 30px rgba(0,0,0,.22);border-radius:12px;transform:scale(1.02);background:var(--card)}
.c-top{display:flex;align-items:center;gap:10px}
.c-sw{width:26px;height:26px;border-radius:7px;flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.c-name{flex:1;min-width:0;position:relative}
.c-name select{width:100%;font-weight:600;color:var(--label);padding:6px 18px 6px 0;text-align:start}
.c-name .chev{left:0}
.c-more,.c-handle{width:36px;height:36px;border:0;border-radius:18px;background:var(--fill);color:var(--label-2);font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.c-handle{background:none;cursor:grab;touch-action:none;font-size:20px;color:var(--label-3)}
.c-bot{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;padding-inline-start:36px}
.c-bot .seg button{min-height:30px;padding:0 11px;font-size:16px}
.c-msg{margin:7px 0 0;padding-inline-start:36px;font-size:12.5px;line-height:1.4;color:var(--red);display:none}
.cell.bad .c-msg,.cell.warn .c-msg{display:block}
.cell.warn .c-msg{color:var(--amber)}
.c-idx{font-size:12px;color:var(--label-3);font-variant-numeric:tabular-nums;min-width:18px;text-align:center}
.empty{padding:26px 16px;text-align:center;color:var(--label-2);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{border:0;background:var(--card);border-radius:12px;box-shadow:var(--shadow);min-height:52px;padding:8px 10px;display:flex;align-items:center;gap:8px;text-align:start;font-size:13.5px;font-weight:500;line-height:1.2;transition:transform .12s}
.tile:active{transform:scale(.95)}
.tile i{width:16px;height:28px;border-radius:4px;flex:none}
.rowbtns{display:flex;gap:8px;margin-top:10px}
.rowbtns button{flex:1;min-height:44px;border:0;border-radius:12px;background:var(--card);box-shadow:var(--shadow);color:var(--tint);font-weight:600;font-size:15px}
.rowbtns button.danger{color:var(--red)}

.edgecard .li.sub{transition:opacity .2s}
.edgecard .li.sub[hidden]{display:none}

.scrim{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:91;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 24px));transform:translate(-50%,120%);transition:transform .35s var(--ease)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grp{background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px}
.sheet .ttl{padding:12px 16px;text-align:center;font-size:13px;color:var(--label-2);border-bottom:.5px solid var(--sep)}
.sheet button,.sheet label.act{display:flex;width:100%;min-height:56px;align-items:center;justify-content:center;border:0;background:none;font-size:18px;color:var(--tint);cursor:pointer}
.sheet .grp>*+*{border-top:.5px solid var(--sep)}
.sheet button.danger{color:var(--red)}
.sheet button.cancel{background:var(--card);border-radius:14px;font-weight:600}
.sheet button:disabled{color:var(--label-3)}

.toast{position:fixed;z-index:95;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-30px);opacity:0;pointer-events:none;background:rgba(28,28,30,.92);color:#fff;border-radius:22px;padding:10px 8px 10px 18px;padding-inline-start:18px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;transition:transform .35s var(--ease),opacity .25s;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:14px;min-height:30px;padding:0 12px;font-weight:600;font-size:14px}
.toast button[hidden]{display:none}

/* ===== DXF export kit ===== */
.btn-primary{width:100%;min-height:44px;border:0;border-radius:12px;background:var(--tint);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-primary:active{filter:brightness(.92)}
.btn-primary[disabled]{opacity:.5;cursor:default}
#dxfInfo{font-size:12.5px;color:var(--label-2);line-height:1.5;margin:10px 0 0}

@media (max-width:600px){
  .stage{position:static}
  .nav h1 small{display:none}
  .nav h1{white-space:nowrap;font-size:17px}
  .nav-in{gap:6px}
  .nbtn{min-width:40px;padding:0 9px}
  .nbtn .t{display:none}
  .grid3{grid-template-columns:1fr 1fr}
  .stp input{width:54px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.nav,.insp,.canvas-bar,.ribbon-wrap,.guide-ov{display:none}}

.guide-ov{position:fixed;inset:0;z-index:200;background:var(--bg);opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .28s var(--ease),transform .28s var(--ease)}
.guide-ov.on{opacity:1;pointer-events:auto;transform:none}
.guide-bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;min-height:56px;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));

<script data-light="#F2F2F7" data-dark="#000000" data-slot=".nav-in">

      '</div>'+
      '<label class="mh-row"><span class="mh-row-t"><b>זכוכית iOS</b><small>שקיפות וטשטוש מאחורי הכרטיסים</small></span>'+
